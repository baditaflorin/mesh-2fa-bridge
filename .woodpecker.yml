when:
  event:
    - push
    - pull_request

steps:
  verify:
    image: node:22-bookworm
    commands:
      - git clone --depth 1 https://github.com/baditaflorin/mesh-common.git ../mesh-common
      - npm ci --prefix ../mesh-common
      - npm ci
      - npx playwright install --with-deps chromium
      - npm run fmt:check
      - npm run typecheck
      - npm run build
      - npm run smoke
      - CI=true npm run test
      - CI=true PLAYWRIGHT_PORT=4175 MESH_LEAK_DURATION_MS=5000 MESH_LEAK_NOISE_OPS=24 npm run test:leak
      - CI=true PLAYWRIGHT_PORT=4176 npm run audit:security
      - npm audit --audit-level=high
